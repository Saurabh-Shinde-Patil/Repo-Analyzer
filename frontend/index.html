<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      // Prevent flash: apply theme from localStorage before paint
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AgniX — Understand any GitHub repository in seconds using AI. Architecture analysis, code explorer, security scan & more." />
    <meta name="keywords" content="github repository analysis, AI code analysis, codebase intelligence, code explorer" />
    <meta property="og:title" content="AgniX — AI-Powered Repository Intelligence" />
    <meta property="og:description" content="Stop reading repositories. Start understanding them." />
    <meta name="theme-color" content="#070B14" />
    <title>AgniX — AI Repository Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
